<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>
    <h3>Register</h3>
    <fieldset>
        <legend>Person Details</legend>
        <form name="form1" action="processData.php" method="POST">
            <div class="field">
                <label for="surname">Surname</label>
                <input type="text" name="surname" size="15"/>
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="text" name="email" size="15"/>
            </div>
            <div class="field">
                <label for="passwd">Password</label>
                <input type="password" name="passwd" size="15"/>
            </div>
            <div class="field">
                <label for="address">Street Address</label>
                <textarea name="address" rows="3" cols="22"></textarea>
            </div>
            <div class="field">
                <label for="state">State</label>
                <select name="state">
                    <option value="-1">choose your state</option>
                    <option value="1">Australian Capital Territory</option>
                    <option value="2">Queensland</option>
                    <option value="3">Victoria</option>
                    <option value="4">New South Wales</option>
                    <option value="5">Tasmania</option>
                    <option value="6">South Australia</option>
                    <option value="7">Western Australia</option>
                    <option value="8">Northern Territory</option>
                </select>
            </div>
            <div class="field">
                <input type="hidden" name="country" value="Australia"/>
            </div>
            <div class="field">
                <label for="sex">Gender</label>
                <input type="radio" name="sex" value="male"/>Male
                <input type="radio" name="sex" value="female"/>Female
            </div>
            <div class="field">
                <label for="vegetarian">Vegetarian?</label>
                <input type="checkbox" name="vegetarian"/>
            </div>
            <div class="field">
                <label></label>
                <input type="submit" name="submit" value="Submit"/>
                <input type="reset" name="reset" value="Reset"/>
            </div>
        </form>
    </fieldset>
</body>
</html>
