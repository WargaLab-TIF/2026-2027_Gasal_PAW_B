<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
<h1>Register</h1>

<fieldset>
	<legend>person details</legend>
	<form name="form" action="processData.php" method="POST">
		<div class="field">
			<label for="surname">surname</label>
			<input type="text" name="surname" size="31"/>
		</div>
				<div class="field">
			<label for="email">email address</label>
			<input type="text" name="email" size="31"/>
		</div>
		<div class="field">
			<label for="password">password</label>
			<input type="text" name="password" size="31"/>
		</div>
		<div class="field">
			<label for="address">street Address</label>
			<textarea name="address" rows="3" cols="22"></textarea>
		</div>
			<div class="field">
			<label for="state">state</label>
			<select name="state">
				<option value="-1" selected>[choose your state]</option>
				<option value="1">Australian Capital Tettitory</option>
				<option value="2">Queensland</option>
				<option value="3">Victoria</option>
				<option value="4">New sounth wales</option>
				<option value="5">Victoria</option>
				<option value="6">South Australia</option>
				<option value="7">Western Australia</option>
                <option value="8">Northern Territory</option>
            </select>
            </div>

            <div class="field">
                <input type="hidden" name="country" value="Australia">
            </div>

            <div class="field">
                <label for="sex">Gender</label>
                <input type="radio" name="sex" value="male"/>Male
                <input type="radio" name="sex" value="female"/>Female
            </div>

            <div class="field">
                <label for="vegetarian">Vegetarian?</label>
                <input type="checkbox" name="vegetarian" />
            </div>

            <div class="field">
                <label>&nbsp;</label>
                <input type="submit" value="Submit" name="submit"/>
                <input type="reset" value="Reset" name="reset"/>
            </div>
        </form>
</fieldset>
</body>
</html>
