<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <h1>Register</h1>
    <!-- bungkus -->
    <fieldset> 
    <legend>Person Details</legend>
    <form name="myForm" action="processData.php" method="post">
        <div class="field">
            <label for="surname">Surname</label>
            <input type="text" name="surname" id="surname" size="31">
        </div>
        <div class="field">
            <label for="email">Email Addres</label>
            <input type="text" name="email" size="31">
        </div>
        <div class="field">
            <label for="pasword">Pasword</label>
            <input type="password" name="password" size="31">
        </div>
        <div class="field">
            <label for="Addres">Street Addres</label>
            <textarea name="Addres" rows="3" cols="22"></textarea>
        </div>
        <div class="field">
            <label for="state">State</label>
            <select name="state">
                <option value="-1" selected>[choose your state]</option>
                <option value="1">Australian Capital Territory</option>
                <option value="2">Queensland</option>
                <option value="3">Victoria</option>
                <option value="4">New Sout Wales</option>
                <option value="5">Tasmania</option>
                <option value="6">Shouth Australia</option>
                <option value="7">Western Australia</option>
                <option value="8">Northen Territory</option>
            </select>
        </div>
        <div class="field">
            <input type="hidden" name="contry" value="Australia">
        </div>
        <div class="field">
            <label for="sex">Gender</label>
            <input type="radio" name="sex" value="Male" id="Male">
            <label for="Male">Male</label>
            <input type="radio" name="sex" value="Female" id="Female">
            <label for="Male">Female</label>
        </div>
        <div class="field">
            <label for="vegetarian">Vegetarian?</label>
            <input type="checkbox" name="vegetarian
            ">
        </div>
        <div class="field">
            <label>&nbsp;</label>
            <input type="submit" value="Submit" name="submit" />
            <input type="reset" value="Reset" name="reset">
        </div>

    </form>
    </fieldset>
</body>
</html>
